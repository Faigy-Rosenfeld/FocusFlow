server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the Cloud Run backend
    location /api/ {
        proxy_pass https://focusflow-backend-487393220084.me-west1.run.app;
        proxy_ssl_server_name on;
        proxy_set_header Host focusflow-backend-487393220084.me-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Serve static assets with caching
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|onnx|task|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other routes -> index.html (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
